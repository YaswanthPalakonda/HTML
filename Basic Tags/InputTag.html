<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All HTML Input Types</title>
</head>
<body>

<h2>HTML Input Types</h2>

<form>

    <input type="text" placeholder="Enter text"><br><br>

    <input type="password" placeholder="Enter password"><br><br>

    <input type="email" placeholder="Enter email"><br><br>

    <input type="number" placeholder="Enter number"><br><br>

    <input type="tel" placeholder="Enter phone number"><br><br>

    <input type="url" placeholder="Enter website URL"><br><br>

    <input type="search" placeholder="Search here"><br><br>

    <input type="date"><br><br>

    <input type="time"><br><br>

    <input type="datetime-local"><br><br>

    <input type="month"><br><br>

    <input type="week"><br><br>

    <input type="color"><br><br>

    <input type="range" min="0" max="100"><br><br>

    <label>
        <input type="checkbox"> HTML
    </label><br><br>

    <label>
        <input type="radio" name="gender"> Male
    </label>
    <label>
        <input type="radio" name="gender"> Female
    </label>
    <br><br>

    <input type="file"><br><br>

    <input type="hidden" value="Hidden Value">

    <input type="image"
           src="https://via.placeholder.com/100x40?text=Submit"
           alt="Submit">
    <br><br>

    <input type="submit" value="Submit">

    <input type="reset" value="Reset">

    <input type="button" value="Click Me" onclick="alert('Button Clicked!')">

</form>


</body>
</html>
